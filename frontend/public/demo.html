<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sentinel · 라이브 대시보드 시연</title>
<script>
  try{
    localStorage.setItem("account","SUPER");localStorage.setItem("role","NURSE");
    localStorage.setItem("userName","통합관리자");localStorage.setItem("hospital","광주 디지털요양병원");
    localStorage.setItem("hospitalId","gwangju");localStorage.setItem("region","광주광역시");
    localStorage.setItem("sentinel_guardian_session",JSON.stringify({guardian:"이영희 보호자",patient:"김복순 어르신",room:"201호 다인실",space_id:"ward_a"}));
    localStorage.setItem("sentinel_guardian_alerts",JSON.stringify([
      {ts:Date.now()-240000,tier:"ALERT",st:"자동 조치 중",msg:"공기청정기를 급속으로 자동 가동했습니다"},
      {ts:Date.now()-5400000,tier:"CAUTION",st:"관리 중",msg:"공기 환기를 권고하고 모니터링을 강화했습니다"}]));
  }catch(e){}
</script>
<style>
  :root{--cream:#FBF6EE;--ink:#4A443C;--sage:#7E947A;--gold:#BE9A4E;--red:#C06B4F;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0c0c0c;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;background:#fff;overflow:hidden}
  #dash{position:absolute;inset:0;width:1920px;height:1080px;border:0;z-index:1;background:#fff}

  /* 비네트 & 딤 */
  #dim{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .7s;background:radial-gradient(circle at var(--fx,50%) var(--fy,45%), rgba(58,53,46,0) 18%, rgba(58,53,46,.32) 58%)}
  #dim.on{opacity:1}
  #vig{position:absolute;inset:0;z-index:3;pointer-events:none !important;box-shadow:inset 0 0 280px rgba(74,53,30,.25)}

  /* 하이라이트 링 */
  #hl{position:absolute;z-index:4;pointer-events:none;opacity:0;border-radius:12px;border:2.5px solid rgba(190,154,78,.85);box-shadow:0 0 0 4px rgba(190,154,78,.18),0 0 24px rgba(190,154,78,.4);transition:opacity .3s,left .25s,top .25s,width .25s,height .25s}
  #hl.on{opacity:1}
  @keyframes hlpulse{50%{box-shadow:0 0 0 8px rgba(190,154,78,.1),0 0 40px rgba(190,154,78,.5)}}
  #hl.on{animation:hlpulse 1.4s ease-in-out infinite}

  /* 커서 & 리플 */
  #cur,#rip,#cap,#badge{pointer-events:none}
  #startbtn{pointer-events:auto}
  #cur{position:absolute;z-index:6;width:36px;height:36px;left:960px;top:540px;pointer-events:none;
    filter:drop-shadow(0 0 14px rgba(126,148,122,.6)) drop-shadow(0 3px 6px rgba(0,0,0,.4));
    transition:left 1.1s cubic-bezier(.22,1,.36,1),top 1.1s cubic-bezier(.22,1,.36,1)}
  #cur svg{width:100%;height:100%}
  #rip{position:absolute;z-index:5;width:16px;height:16px;border-radius:50%;background:rgba(190,154,78,.7);transform:translate(-50%,-50%);opacity:0}
  #rip.go{animation:rp .65s ease-out}
  @keyframes rp{0%{opacity:.8;width:16px;height:16px}100%{opacity:0;width:150px;height:150px}}

  /* 섹션 전환 플래시 */
  #flash{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;background:#FBF6EE}
  @keyframes sflash{0%{opacity:.45}100%{opacity:0}}

  /* 배지 */
  #badge{position:absolute;top:26px;left:34px;z-index:7;padding:9px 20px;border-radius:999px;background:rgba(250,244,234,.94);border:1px solid rgba(74,68,60,.12);color:var(--sage);font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.12)}

  /* 자막 */
  #cap{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:7;max-width:1400px;padding:18px 42px;border-radius:16px;
    background:rgba(250,244,234,.97);color:var(--ink);font-weight:800;font-size:32px;text-align:center;
    box-shadow:0 16px 44px rgba(0,0,0,.22);border:1px solid rgba(74,68,60,.1);opacity:0;transition:opacity .35s;
    white-space:nowrap}
  #cap.on{opacity:1}
  #cap .k{color:var(--sage)}
  #cap .r{color:#C06B4F}
  #cap .g{color:#be9a4e}

  /* 인트로/아웃트로 카드 */
  #card{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:radial-gradient(1400px 900px at 50% 25%, #FBF6EE, #E7DAC4);opacity:0;transition:opacity .8s;pointer-events:none}
  #card.on{opacity:1}
  #cfx{position:absolute;inset:0;z-index:1}
  #card .cardin{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px}
  #card .lg{font-size:128px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(120deg,var(--sage),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 34px rgba(190,154,78,.4))}
  #card.on .lg{animation:logoIn 1.3s cubic-bezier(.16,1,.3,1) both, glow 3.2s ease-in-out 1.3s infinite}
  #card.on .sub{animation:upFade 1s .5s both}
  #card.outro .lg{font-size:96px}
  #card.outro .sub{font-size:28px;color:#7E947A}
  @keyframes logoIn{0%{opacity:0;letter-spacing:.2em;filter:blur(14px) drop-shadow(0 6px 34px rgba(190,154,78,0))}100%{opacity:1;letter-spacing:-.03em;filter:blur(0) drop-shadow(0 6px 34px rgba(190,154,78,.4))}}
  @keyframes glow{50%{filter:blur(0) drop-shadow(0 6px 48px rgba(190,154,78,.7))}}
  @keyframes upFade{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
  #card .sub{font-size:34px;font-weight:700;color:#5C564D}
  #card .tag{font-size:20px;font-weight:600;color:#8C8680;letter-spacing:.05em;text-transform:uppercase}
  #cur{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-7px)}}
</style>
</head>
<body>
<div id="stage">
  <iframe id="dash"></iframe>
  <div id="dim"></div>
  <div id="vig"></div>
  <div id="hl"></div>
  <div id="rip"></div>
  <div id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l7 18 2.5-7.5L20 10 3 2z" fill="#fff" stroke="#3A352E" stroke-width="1.3"/></svg></div>
  <div id="badge">ThinQ Sentinel · 실시간 시연</div>
  <div id="cap"></div>
  <div id="flash"></div>
  <div id="card" class="on"><canvas id="cfx"></canvas><div class="cardin">
    <div class="tag">Smart Nursing Home · Infection Control</div>
    <div class="lg">Sentinel</div>
    <div class="sub">스마트 요양병원 감염관리 · 실시간 시연</div>
    <button id="startbtn" style="margin-top:22px;padding:18px 52px;border:0;border-radius:999px;background:linear-gradient(135deg,#7E947A,#5C7858);color:#fff;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 14px 34px rgba(126,148,122,.45);letter-spacing:.02em">▶ 소리와 함께 재생</button>
  </div></div>
</div>
<audio id="bgm" src="/demo_bgm.m4a" loop></audio>
<audio id="nar"></audio>

<script>
const $=(id)=>document.getElementById(id);
const dash=$("dash"), cur=$("cur"), rip=$("rip"), cap=$("cap"), card=$("card"), dim=$("dim"), bgm=$("bgm"), hl=$("hl"), flash=$("flash");
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$("stage").style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener("resize",fit);fit();

// 인트로/아웃트로 골든 입자
const cfx=$("cfx"), cctx=cfx.getContext("2d"); cfx.width=1920; cfx.height=1080;
let cfxOn=false, cps=[];
function cardFx(on){
  if(on){ if(!cfxOn){ cfxOn=true; cps=Array.from({length:90},()=>({x:Math.random()*1920,y:Math.random()*1080+200,r:1+Math.random()*3,vx:(Math.random()-.5)*.3,vy:-(.2+Math.random()*.7),a:.15+Math.random()*.5})); cfxLoop(); } }
  else cfxOn=false;
}
function cfxLoop(){
  if(!cfxOn){ cctx.clearRect(0,0,1920,1080); return; }
  cctx.clearRect(0,0,1920,1080);
  for(const p of cps){ p.x+=p.vx; p.y+=p.vy; if(p.y<-12){p.y=1092;p.x=Math.random()*1920;}
    cctx.beginPath(); cctx.arc(p.x,p.y,p.r,0,7); cctx.fillStyle=`rgba(190,154,78,${p.a})`; cctx.fill(); }
  requestAnimationFrame(cfxLoop);
}

const idoc=()=>dash.contentDocument||dash.contentWindow.document;
function setCur(x,y){cur.style.left=x+"px";cur.style.top=y+"px";}
function ripple(x,y){rip.style.left=x+"px";rip.style.top=y+"px";rip.classList.remove("go");void rip.offsetWidth;rip.classList.add("go");}
function say(html){cap.classList.remove("on");cap.innerHTML=html;void cap.offsetWidth;cap.classList.add("on");}
function hideCap(){cap.classList.remove("on");}
function focus(x,y){dim.style.setProperty("--fx",(x/1920*100)+"%");dim.style.setProperty("--fy",(y/1080*100)+"%");dim.classList.add("on");}
function unfocus(){dim.classList.remove("on");hl.classList.remove("on");}

function sectionFlash(){
  flash.style.animation="none"; void flash.offsetWidth;
  flash.style.animation="sflash .5s ease-out forwards";
}

// 요소 하이라이트 링
function highlight(el){
  if(!el){hl.classList.remove("on");return;}
  const r=el.getBoundingClientRect();
  const pad=10;
  hl.style.left=(r.left-pad)+"px"; hl.style.top=(r.top-pad)+"px";
  hl.style.width=(r.width+pad*2)+"px"; hl.style.height=(r.height+pad*2)+"px";
  hl.classList.remove("on"); void hl.offsetWidth; hl.classList.add("on");
}

// iframe 안에서 텍스트/역할로 요소 찾기
function findByText(re, sel="*"){
  const d=idoc(); if(!d) return null;
  const els=d.querySelectorAll(sel);
  for(const el of els){ const t=(el.innerText||el.textContent||"").trim(); if(t && re.test(t) && el.offsetParent!==null) return el; }
  return null;
}
function findClickable(re){
  return findByText(re,"button,a,[role=button]") || findByText(re,"h4,div,span,p");
}

// 특정 tier를 가진 병실 카드 찾기 (h4 우선)
function findRoomCard(tierCls){
  const d=idoc(); if(!d) return null;
  // tier 클래스를 가진 카드 내부의 h4 (roomCode)
  const cards=d.querySelectorAll(".cursor-pointer");
  for(const card of cards){
    const h4=card.querySelector("h4");
    if(h4 && h4.offsetParent!==null) return card;
  }
  return null;
}

async function moveTo(el,{click=false,foc=true,fb=[960,330],hl:doHL=true}={}){
  let x,y;
  if(el){ const r=el.getBoundingClientRect(); x=r.left+r.width/2; y=r.top+r.height/2; }
  else { x=fb[0]; y=fb[1]; }
  setCur(x,y); await sleep(1100);
  if(foc) focus(x,y);
  if(doHL && el) highlight(el);
  if(click&&el){ ripple(x,y); await sleep(180); try{el.click();}catch(e){} }
  return {x,y};
}
async function waitDash(ms=2500){ await sleep(ms); }
async function nav(path,ms=3000){
  unfocus(); sectionFlash();
  dash.src=path;
  await new Promise(res=>{dash.onload=()=>res();setTimeout(res,7000);});
  await sleep(ms);
}
async function api(path){ try{await fetch(path,{method:"POST"});}catch(e){} }

async function reset(){
  unfocus(); sectionFlash();
  await api("/api/sentinel/external/clear-region");
  try{localStorage.setItem("role","NURSE");}catch(e){}
  dash.src="/dashboard";
  await new Promise(res=>{dash.onload=()=>res();setTimeout(res,7000);});
  await waitDash(3500);
}

function narrate(i){
  return new Promise(res=>{
    const a=$("nar"); let done=false; const fin=()=>{if(done)return;done=true;res();};
    a.onended=()=>setTimeout(fin,500); a.onerror=()=>setTimeout(fin,2500);
    try{ a.src="/audio/demo_"+i+".mp3"; a.currentTime=0; a.play().catch(()=>setTimeout(fin,2800)); }catch(e){ setTimeout(fin,2800); }
    setTimeout(fin,16000);
  });
}

async function run(){
  startBgm();

  // ── 인트로 ──────────────────────────────────────────────────
  card.className="on"; cardFx(true); hideCap(); await narrate(0);
  cardFx(false); card.className=""; await sleep(700);
  sectionFlash();

  while(true){
    await reset();

    // ── 1. 간호사 관제 개요 ──────────────────────────────────
    say('실시간 <span class="k">병동 관제</span> — 5단계 심각도');
    const nurseHdr=findByText(/간호사 관제|병동 관제/,"h1,h2,h3,h4,p");
    await moveTo(nurseHdr||null, {foc:true, fb:[960,200]});
    await narrate(1);

    // ── 2. 병실 클릭 (가장 위험한 호실) ────────────────────
    say('병실 클릭 — <span class="r">위험</span> 병실 상세 확인');
    // 202호(HIGH_RISK) 또는 104호(ALERT) 우선, 없으면 아무 병실
    const roomEl = findByText(/202호|104호/,"h4") || findByText(/호 다인실|호 1인실|호$/,"h4");
    const roomCard = roomEl ? roomEl.closest(".cursor-pointer") || roomEl : findRoomCard();
    await moveTo(roomCard, {click:true, fb:[700,400]});
    await narrate(2);
    // 모달 닫기
    try{
      const closeBtn=findByText(/닫기/,"button") || findClickable(/×|close/);
      if(closeBtn){closeBtn.click();}
      else{ idoc().dispatchEvent(new KeyboardEvent("keydown",{key:"Escape",bubbles:true})); }
    }catch(e){}
    hl.classList.remove("on"); await sleep(600);

    // ── 3. 외부 조기경보 배너 ────────────────────────────────
    say('외부 <span class="k">조기경보</span> — 지역 감염병 위험 신호 선제 감지');
    const alertBanner=findByText(/외부 감염병 조기경보|조기경보/,"p,h3,div");
    await moveTo(alertBanner, {foc:true, fb:[960,210]});
    await narrate(3);

    // ── 4. 선제 경보 발령 ────────────────────────────────────
    say('센서 정상이어도 전 병동 <span class="r">선제 위험 상향</span>');
    const boostBtn=findClickable(/외부 유행 경보 발령|경보 발령/);
    await moveTo(boostBtn, {click:true, fb:[1500,220]});
    await narrate(4);

    // ── 5. 시설·가전 탭 ─────────────────────────────────────
    say('<span class="k">시설·가전 제어</span> — 위험도 비례 ThinQ 자동 방역');
    unfocus();
    const fmBtn=findClickable(/시설·가전 제어/);
    await moveTo(fmBtn, {click:true, fb:[120,400]});
    await narrate(5);

    // ── 6. 코웨이 급속 ───────────────────────────────────────
    say('코웨이 공기청정기 <span class="k">급속(터보)</span> — 실제 가동 중');
    await sleep(1000); // FM 뷰 렌더 대기
    const rapidBtn=findClickable(/^급속$/);
    await moveTo(rapidBtn, {click:true, fb:[820,680]});
    await narrate(6);

    // ── 7. 경영 리포트 (시각만) ──────────────────────────────
    say('<span class="g">경영 리포트</span> — 감염관리 활동 자동 증빙 · 적정성평가 대비');
    unfocus();
    const dirBtn=findClickable(/경영 리포트/);
    await moveTo(dirBtn, {click:true, fb:[120,500]});
    await sleep(4500);
    hideCap();

    // ── 8. 보호자 앱 ─────────────────────────────────────────
    say('<span class="k">보호자 앱</span> — 지금 병원이 하는 일을 가족에게');
    await nav("/guardian/home",2200);
    await narrate(7);

    say('병동 — 환경·조치 현황');
    await nav("/guardian/ward",1800);
    await narrate(8);

    say('<span class="k">알림</span> — 위험 상황 시 즉시 도착');
    await nav("/guardian/alerts",2000);
    await narrate(9);

    // ── 아웃트로 ─────────────────────────────────────────────
    unfocus(); sectionFlash();
    card.querySelector(".sub").textContent="공간이 스스로 대비합니다";
    card.querySelector(".tag").textContent="From Detection to Response — Autonomously";
    card.className="on outro"; cardFx(true); hideCap();
    await narrate(10);
    cardFx(false); card.className=""; await sleep(600);
  }
}

dash.addEventListener("load",()=>{}, {once:true});
function startBgm(){ /* BGM 비활성화 */ }
function start(){ if(window.__started)return; window.__started=true; const sb=$("startbtn"); if(sb)sb.style.display="none"; run(); }
$("startbtn").addEventListener("click",(e)=>{ e.stopPropagation(); start(); });
addEventListener("pointerdown",start,{once:true});
addEventListener("pointerdown",()=>{ });
setTimeout(()=>{ if(!window.__started){window.__started=true; const sb=$("startbtn"); if(sb)sb.style.display="none"; run();} },25000);
</script>
</body>
</html>
